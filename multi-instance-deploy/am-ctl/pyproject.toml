[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "am-ctl"
version = "0.91.0"
description = "Agent Matrix fleet management control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "httpx>=0.27",
    "rich>=13.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "aiosqlite>=0.20",
    "coverage>=7.0",
]

[project.scripts]
am-ctl = "amctl_cli.cli:main"
am-ctl-server = "amctl.app:run"

[tool.setuptools.packages.find]
include = ["amctl*"]
